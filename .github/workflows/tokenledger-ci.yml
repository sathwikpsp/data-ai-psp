name: TokenLedger CI
on:
  push:
    paths: ["projects/tokenledger-ai/**", ".github/workflows/tokenledger-ci.yml"]
  pull_request:
    paths: ["projects/tokenledger-ai/**", ".github/workflows/tokenledger-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tokenledger-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/tokenledger-ai
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: Reproduce synthetic data and ML evaluation
        run: |
          uv run tokenledger demo
          uv run tokenledger evaluate --output reports/evaluation.json
          uv run tokenledger export --output reports/demo-report.json
          uv run python scripts/check_demo.py
          uv run python scripts/build_site.py
          uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tokenledger-demo-and-evaluation
          path: |
            projects/tokenledger-ai/site/
            projects/tokenledger-ai/reports/
            projects/tokenledger-ai/dist/
          retention-days: 14
      - name: Build and smoke-test container
        run: |
          docker build -t tokenledger:ci .
          docker run -d --name tokenledger-ci -p 127.0.0.1:8000:8000 -e TOKENLEDGER_BOOTSTRAP_DEMO=true tokenledger:ci
          trap 'docker logs tokenledger-ci; docker rm -f tokenledger-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/api/v1/report | python -c 'import json,sys; d=json.load(sys.stdin); assert d["overview"]["requests"] == 5424; assert d["forecast"]["status"] == "ready"'
