services:
  tokenledger:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TOKENLEDGER_MODE: ${TOKENLEDGER_MODE:-demo}
      TOKENLEDGER_BOOTSTRAP_DEMO: ${TOKENLEDGER_BOOTSTRAP_DEMO:-true}
      TOKENLEDGER_API_KEY: ${TOKENLEDGER_API_KEY:-}
      TOKENLEDGER_DATA_DIR: /data
    volumes:
      - tokenledger-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
volumes:
  tokenledger-data:
